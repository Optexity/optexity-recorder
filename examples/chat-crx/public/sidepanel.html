<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optexity Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .header h1 {
        color: white;
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0;
        flex-shrink: 0;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .attach-button {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        color: white;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .attach-button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.05);
      }

      .attach-button svg {
        width: 16px;
        height: 16px;
      }

      /* Toggle switch styles */
      .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }

      .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .message {
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 1rem;
        font-size: 0.9rem;
        line-height: 1.4;
        animation: fadeIn 0.3s ease-out;
      }

      .message.user {
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        align-self: flex-end;
        border-bottom-right-radius: 0.3rem;
      }

      .message.bot {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        align-self: flex-start;
        border-bottom-left-radius: 0.3rem;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .processing {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 1rem;
        border-bottom-left-radius: 0.3rem;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 80%;
      }

      .loading-bar {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .loading-progress {
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent
        );
        border-radius: 2px;
        animation: slide 2s infinite;
        width: 30%;
      }

      .input-container {
        padding: 1rem;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      .input-wrapper {
        display: flex;
        gap: 0.5rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        padding: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      #messageInput {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: white;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        border-radius: 1rem;
      }

      #messageInput::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      #sendButton {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: 50%;
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        color: white;
      }

      #sendButton:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.05);
      }

      #sendButton:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .stop-button {
        width: 100%;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 1.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .stop-button:hover {
        background: #dc2626;
        transform: scale(1.02);
      }

      .stop-button svg {
        width: 18px;
        height: 18px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(333%);
        }
      }

      /* Scrollbar styling */
      .messages::-webkit-scrollbar {
        width: 6px;
      }

      .messages::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
      }

      .messages::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      .mode-toggle-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle-switch {
        position: relative;
        width: 50px;
        height: 26px;
        margin: 0;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(255, 255, 255, 0.2);
        transition: 0.4s;
        border-radius: 34px;
      }

      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .toggle-slider {
        background-color: rgba(255, 255, 255, 0.8);
      }

      input:checked + .toggle-slider:before {
        transform: translateX(24px);
      }

      .mode-label {
        color: white;
        font-size: 0.9rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
      <div class="header">
        <h1>Optexity Chat</h1>
        <div class="header-controls">
          <button id="attachButton" class="attach-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8"/>
              <path d="M12 3v12"/>
              <path d="M8 7l4-4 4 4"/>
            </svg>
            Attach This Tab
          </button>
          <span class="mode-label">Autonomous</span>
        <label class="toggle-switch">
          <input type="checkbox" id="modeToggle" />
          <span class="toggle-slider"></span>
        </label>
        <span class="mode-label">Manual</span>
        </div>
      </div>

    <div class="chat-container">
      <div class="messages" id="messages"></div>

      <div class="input-container" id="input-container">
        <div class="input-wrapper">
          <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            autocomplete="off"
          />
          <button id="sendButton">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="m22 2-7 20-4-9-9-4z" />
              <path d="M22 2 11 13" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
